; PlatformIO project for the OSCLINGA custom ESP32-WROOM-32 PCB
; https://github.com/mirkopetrovich/osclinga
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = spiffs
board_build.partitions = default.csv
lib_deps =
    rodan/ds3231
    igorantolic/Ai Esp32 Rotary Encoder
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    cnmat/OSC
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer

; Generic ESP32-WROOM-32 devkit bring-up/test target - no DS3231 RTC, no
; rotary encoders, no MAX3485 RS485 physically wired. Safe to compile-test
; and bench-flash before touching a real custom PCB.
[env:devboard]
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=3

; Real custom OSCLINGA PCB #1 - full hardware present (DS3231 RTC, 2x rotary
; encoder, MAX3485 RS485/Modbus). BOARD_ID drives this unit's WiFi AP SSID
; (osclinga1) and gateway IP (192.168.1.1) so multiple boards can run
; simultaneously without colliding.
[env:pcb_board1]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D HAVE_RTC=1
    -D HAVE_ENCODERS=1
    -D HAVE_MODBUS=1
    -D BOARD_ID=1
; Auto-reset circuit (Q10 on DTR->EN, Q1 on RTS->GPIO0, standard DOIT
; devkit-style 2-transistor design). Lower upload speed for reliability
; over this board's CP2104 bridge (921600 was unreliable for the reset dance).
upload_speed = 115200

; Real custom OSCLINGA PCB #2 - same as pcb_board1, distinct BOARD_ID so it
; gets SSID osclinga2 / gateway 192.168.2.1.
[env:pcb_board2]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D HAVE_RTC=1
    -D HAVE_ENCODERS=1
    -D HAVE_MODBUS=1
    -D BOARD_ID=2
upload_speed = 115200
